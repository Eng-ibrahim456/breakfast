<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>فاتورة الفطار</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fb;--card:#fff;--ink:#16273a;--mut:#6b7c8f;--head:#4f8fcf;--headink:#fff;--row:#e3eef9;--line:#bcd3ea;--tot:#ffe94d;--totink:#16273a;--btn:#4f8fcf;--danger:#c0392b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1823;--card:#16222f;--ink:#e8f0f8;--mut:#93a5b8;--head:#2e5f94;--row:#1b2a3a;--line:#2c4258;--tot:#d9b800;--totink:#101820;--btn:#5b9bd5}}
:root[data-theme="dark"]{--bg:#0f1823;--card:#16222f;--ink:#e8f0f8;--mut:#93a5b8;--head:#2e5f94;--row:#1b2a3a;--line:#2c4258;--tot:#d9b800;--totink:#101820;--btn:#5b9bd5}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;padding:12px 10px 40px}
h1{font-size:20px;margin:4px 4px 10px;display:flex;justify-content:space-between;align-items:center}
.bar{display:flex;gap:8px;flex-wrap:wrap}
button{font-family:inherit;cursor:pointer}
.b{background:var(--btn);color:#fff;border:0;border-radius:8px;padding:8px 14px;font-size:14px;font-weight:600}
.b.o{background:transparent;color:var(--btn);border:1.5px solid var(--btn)}
.b.d{background:var(--danger)}
:focus-visible{outline:3px solid var(--tot);outline-offset:2px}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:10px;margin-top:10px}
table{border-collapse:collapse;width:100%;min-width:100%}
th,td{border:1px solid var(--line);text-align:center;padding:0;height:46px}
th{background:var(--head);color:var(--headink);font-weight:700;font-size:14px;padding:0 6px;white-space:nowrap}
td.n,th.n{position:sticky;right:0;z-index:1;min-width:112px;padding:0 8px;font-weight:600;background:var(--card)}
th.n{background:var(--head);z-index:2}
tbody tr:nth-child(odd) td.n,tbody tr:nth-child(odd) td{background:var(--row)}
td.c{min-width:92px}
.cell{display:flex;align-items:center;justify-content:center;gap:2px}
.cell button{width:28px;height:34px;border:0;background:transparent;color:var(--btn);font-size:20px;font-weight:700;border-radius:6px}
.cell span{min-width:20px;font-size:17px;font-weight:600}
.cell span.z{color:var(--mut);font-weight:400}
tr.tot td{background:var(--tot)!important;color:var(--totink);font-weight:700;font-size:16px}
td.q{min-width:56px;color:var(--mut);font-weight:600}
.inv{margin:18px auto 0;text-align:center}
.inv .l{display:inline-block;background:#ffd966;color:#16273a;font-weight:700;padding:6px 26px;border-radius:4px}
.inv .v{font-size:34px;font-weight:700;margin-top:6px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:12px}
.panel h2{font-size:16px;margin:0 0 10px}
.li{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.li input{font-family:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);min-width:0}
.li input.nm{flex:1}.li input.pr{width:72px;text-align:center}
.li button{border:0;background:transparent;color:var(--danger);font-size:20px;width:34px}
.hid{display:none}
.hint{color:var(--mut);font-size:13px;margin:6px 4px 0}
</style>
</head>
<body>
<h1><span>🥙 فاتورة الفطار</span></h1>
<div class="bar">
  <button class="b" id="bSet">الأصناف والأشخاص</button>
  <button class="b o" id="bClr">يوم جديد (تصفير)</button>
</div>

<div id="settings" class="hid">
  <div class="panel"><h2>الأشخاص</h2><div id="lp"></div><button class="b o" id="addP">+ إضافة شخص</button></div>
  <div class="panel"><h2>الأصناف وسعر الواحد</h2><div id="li"></div><button class="b o" id="addI">+ إضافة صنف</button></div>
</div>

<div class="wrap"><table id="t"></table></div>
<div class="inv"><div class="l">اجمالى الفاتورة</div><div class="v" id="grand">0</div></div>
<p class="hint">اضغط + أو − في الخانة لتغيير العدد. الحفظ تلقائي على الجهاز.</p>

<script>
var KEY="breakfast-v1";
var def={people:["ابراهيم","ابو هانى","سامح","سيد","ابو المعاطى","محمد محمود"],
items:[["طعمية",10],["فول وطعمية",10],["فول وطعمية اسكندرنى",10],["فول",10],["فول اسكندرنى",10],["شيبس",10],["شيبس كاتشب",10],["شيبس طحينه",10],["بطاطس ساده",10],["بطاطس كاتشب",10],["بطاطس طحينة",10]].map(function(x,i){return{id:"i"+i,name:x[0],price:x[1]}}),
qty:{}};
def.people=def.people.map(function(n,i){return{id:"p"+i,name:n}});
var S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
if(!S||!S.people)S=JSON.parse(JSON.stringify(def));
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function uid(p){return p+Date.now().toString(36)+Math.floor(Math.random()*999)}
function q(i,p){return S.qty[i+"|"+p]||0}
function setQ(i,p,v){S.qty[i+"|"+p]=Math.max(0,v);save();render()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function render(){
  var h='<thead><tr><th class="n">الصنف</th>';
  S.people.forEach(function(p){h+='<th>'+esc(p.name)+'</th>'});
  h+='<th>الكمية</th></tr></thead><tbody>';
  S.items.forEach(function(it){
    var sum=0;h+='<tr><td class="n">'+esc(it.name)+'</td>';
    S.people.forEach(function(p){var v=q(it.id,p.id);sum+=v;
      h+='<td class="c"><div class="cell"><button data-a="m" data-i="'+it.id+'" data-p="'+p.id+'" aria-label="نقص">−</button><span class="'+(v?'':'z')+'">'+v+'</span><button data-a="p" data-i="'+it.id+'" data-p="'+p.id+'" aria-label="زود">+</button></div></td>'});
    h+='<td class="q">'+sum+'</td></tr>'});
  h+='<tr class="tot"><td class="n">الاجمالى</td>';
  var g=0;
  S.people.forEach(function(p){var t=0;S.items.forEach(function(it){t+=q(it.id,p.id)*it.price});g+=t;h+='<td>'+t+'</td>'});
  h+='<td></td></tr></tbody>';
  document.getElementById("t").innerHTML=h;
  document.getElementById("grand").textContent=g;
}
document.getElementById("t").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  var i=b.dataset.i,p=b.dataset.p;setQ(i,p,q(i,p)+(b.dataset.a==="p"?1:-1));
});
function renderSet(){
  var a="";
  S.people.forEach(function(p,k){a+='<div class="li"><input class="nm" data-k="'+k+'" data-t="p" value="'+esc(p.name)+'"><button data-d="p'+k+'" aria-label="حذف">✕</button></div>'});
  document.getElementById("lp").innerHTML=a;
  a="";
  S.items.forEach(function(it,k){a+='<div class="li"><input class="nm" data-k="'+k+'" data-t="in" value="'+esc(it.name)+'"><input class="pr" type="number" inputmode="decimal" min="0" data-k="'+k+'" data-t="ip" value="'+it.price+'"><button data-d="i'+k+'" aria-label="حذف">✕</button></div>'});
  document.getElementById("li").innerHTML=a;
}
document.getElementById("settings").addEventListener("input",function(e){
  var d=e.target.dataset;if(!d.t)return;var k=+d.k;
  if(d.t==="p")S.people[k].name=e.target.value;
  if(d.t==="in")S.items[k].name=e.target.value;
  if(d.t==="ip")S.items[k].price=parseFloat(e.target.value)||0;
  save();render();
});
document.getElementById("settings").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b||!b.dataset.d)return;
  var t=b.dataset.d[0],k=+b.dataset.d.slice(1);
  if(t==="p")S.people.splice(k,1);else S.items.splice(k,1);
  save();renderSet();render();
});
document.getElementById("addP").onclick=function(){S.people.push({id:uid("p"),name:"شخص جديد"});save();renderSet();render()};
document.getElementById("addI").onclick=function(){S.items.push({id:uid("i"),name:"صنف جديد",price:10});save();renderSet();render()};
document.getElementById("bSet").onclick=function(){var s=document.getElementById("settings");s.classList.toggle("hid");if(!s.classList.contains("hid"))renderSet()};
var armed=false;
document.getElementById("bClr").onclick=function(){
  var b=this;
  if(!armed){armed=true;b.textContent="اضغط تانى للتأكيد";b.classList.add("d");setTimeout(function(){armed=false;b.textContent="يوم جديد (تصفير)";b.classList.remove("d")},3000);return}
  S.qty={};save();render();armed=false;b.textContent="يوم جديد (تصفير)";b.classList.remove("d");
};
render();
</script>
</body>
</html>
